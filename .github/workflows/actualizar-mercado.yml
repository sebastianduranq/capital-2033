name: Actualizar cierres y dividendos
on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar proveedor
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          EODHD_EXCHANGE: SN
        run: python scripts/actualizar_mercado.py
      - name: Publicar archivos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios.json dividendos-mercado.json
          if ! git diff --cached --quiet; then
            git commit -m "Datos bursátiles: cierre y dividendos"
            git push
          fi
